name: Deploy restaurant-site to GitHub Pages

on:
  push:
    branches: [claude/ui-ux-pro-max-check-twxj3t]
    paths: [restaurant-site/**]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: restaurant-site
        run: npm ci

      - name: Build CSS
        working-directory: restaurant-site
        run: npm run build:css

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: restaurant-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
